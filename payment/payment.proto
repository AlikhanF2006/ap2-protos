syntax = "proto3";

package payment;

option go_package = "github.com/AlikhanF2006/ap2-protos-gen/payment;paymentpb";

service PaymentService {
  rpc ProcessPayment (PaymentRequest) returns (PaymentResponse);
}

message PaymentRequest {
  string order_id = 1;
  double amount = 2;
  string user_id = 3;
}

message PaymentResponse {
  bool success = 1;
  string transaction_id = 2;
  string message = 3;
}